services:
  # PostgreSQLデータベース
  postgres:
    image: postgres:17-alpine
    container_name: dev-jorney-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-jorney-network

  # バックエンドアプリケーション（開発用）
  backend:
    build:
      context: .  # ビルドコンテキスト（Dockerfileがあるディレクトリ）
      dockerfile: Dockerfile  # 使用するDockerfile（デフォルトはDockerfileなので省略可能）
      target: builder  # マルチステージビルドで使用するステージ（builderステージまでビルド）
    container_name: dev-jorney-backend
    # コンテナ起動時にPrisma Clientを生成してから開発サーバーを起動
    command: sh -c "npx prisma generate && npm run start:dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app  # ソースコードをマウント（ホットリロード用）
      - /app/node_modules  # 匿名volumenode_modulesはコンテナ内のものを使用（ビルド済み）
      # /app/dist の匿名ボリュームマウントを削除（NestJSのwatchモードでdistを削除できるようにする）
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-jorney-network

volumes:
  postgres_data:
    driver: local

networks:
  dev-jorney-network:
    driver: bridge

