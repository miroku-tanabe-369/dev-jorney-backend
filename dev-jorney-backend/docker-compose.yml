services:
  # PostgreSQLデータベース
  postgres:
    image: postgres:17-alpine
    container_name: dev-jorney-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-jorney-network

  # バックエンドアプリケーション（開発用）
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      # target: builder # ← 開発時には削除し、ビルドは全ステージで行う
    container_name: dev-jorney-backend
    # ★★★ 修正箇所: ボリュームマウント後に再生成/デプロイ/起動を行う ★★★
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - .:/app  # ソースコードをマウント（ホットリロード用）
      - /app/node_modules  # node_modulesはコンテナ内のものを使用
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-jorney-network

volumes:
  postgres_data:
    driver: local

networks:
  dev-jorney-network:
    driver: bridge